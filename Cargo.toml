[workspace]
resolver = "2"
members = ["crates/apb-core", "crates/apb-decide", "crates/apb-mcp-client", "crates/apb-server", "crates/apb-cli", "crates/apb-engine", "crates/apb-mcp"]

[workspace.package]
version = "1.0.0-rc.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/itechmeat/agentic-playbooks"
homepage = "https://github.com/itechmeat/agentic-playbooks"
rust-version = "1.99"

# Light debug info for iterative builds: backtraces keep file and line, but
# the linker stops packaging full debug info into every test binary (the most
# expensive phase of the per-task cycle). See docs/BUILD-OPTIMIZATION.md.
[profile.dev]
debug = "line-tables-only"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
# Internal crates: published under these package names; the version is exact
# because they are released together and are not a public API.
apb-core = { package = "agentic-playbooks-core", path = "crates/apb-core", version = "=1.0.0-rc.1" }
apb-decide = { package = "agentic-playbooks-decide", path = "crates/apb-decide", version = "=1.0.0-rc.1" }
apb-engine = { package = "agentic-playbooks-engine", path = "crates/apb-engine", version = "=1.0.0-rc.1" }
apb-mcp = { package = "agentic-playbooks-mcp", path = "crates/apb-mcp", version = "=1.0.0-rc.1" }
apb-mcp-client = { package = "agentic-playbooks-mcp-client", path = "crates/apb-mcp-client", version = "=1.0.0-rc.1" }
apb-server = { package = "agentic-playbooks-server", path = "crates/apb-server", version = "=1.0.0-rc.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yaml_serde = "0.10.7"
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
sha2 = "0.11"
hmac = "0.13"
uuid = { version = "1", features = ["v4"] }
percent-encoding = "2"
ureq = { version = "3", features = ["json"] }
regex = "1"
jsonschema = { version = "0.60", default-features = false }
shell-words = "1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "hostname"] }
globset = "0.4"
# Server-mode API keys and session tokens (spec 2026-08-16-server-mode-design):
# CSPRNG bytes, unpadded base64url encoding, and a constant-time comparison for
# everything derived from a secret. No password-hash crate: these are 256-bit
# random tokens, not user-chosen passwords.
base64 = "0.23"
getrandom = "0.4"
subtle = "2.6"
# zcode `ui_sync`: writes one row into ZCode's desktop task index (a SQLite
# database). Bundled, so no system libsqlite3 is needed on any target.
rusqlite = { version = "0.41", features = ["bundled"] }
# Native IMAP execution for the `imap` connector function kind (spec 3.2, wave
# 2): blocking client over a plaintext or rustls stream, silent-read discipline
# (BODY.PEEK, EXAMINE) enforced by the engine.
imap = { version = "2.4", default-features = false }
mail-parser = "1.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
