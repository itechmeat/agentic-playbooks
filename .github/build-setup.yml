# The runner images carry a preinstalled stable Rust that rustup would use as
# is (rust-toolchain.toml only names the channel), and an older image's stable
# can be below the workspace's rust-version. Install the current stable first,
# before any cargo call, like every other build and test job does.
- name: Install Rust
  uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
  with:
    # Pinned by SHA, so the toolchain comes from this input, not the ref.
    toolchain: stable
    components: clippy, rustfmt
    targets: ${{ join(matrix.targets, ',') }}
- name: Install Bun
  uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  with:
    bun-version: latest
- name: Build web frontend (embedded by apb-server at compile time)
  shell: bash
  run: |
    cd web
    bun install --frozen-lockfile
    bun run build
# Build legs only build. The release test gate (fmt, clippy, tests, doctests,
# the release-notes check) runs in .github/workflows/test-gate.yml, one leg per
# shipped OS, beside these builds. It is a local-artifacts job
# (dist-workspace.toml), so the generated host job needs it and refuses to
# publish unless every gate leg succeeded.
