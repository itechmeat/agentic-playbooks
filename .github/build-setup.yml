- name: Install Bun
  uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
  with:
    bun-version: latest
- name: Build web frontend (embedded by apb-server at compile time)
  shell: bash
  run: |
    cd web
    bun install --frozen-lockfile
    bun run build
# Build legs only build. The release test gate (fmt, clippy, tests, doctests,
# the release-notes check) runs in .github/workflows/test-gate.yml, one leg per
# shipped OS, beside these builds. It is a local-artifacts job
# (dist-workspace.toml), so the generated host job needs it and refuses to
# publish unless every gate leg succeeded.
