version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    # Major bumps stay ungrouped on purpose: each is its own PR for review.

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-patch-and-minor:
        update-types:
          - "patch"
          - "minor"
    # Major bumps stay ungrouped on purpose: each is its own PR for review.
    ignore:
      # svelte-check (all versions, latest 4.7.2) crashes on TS 7 with
      # TypeError on typescript.sys.useCaseSensitiveFileNames. Re-enable
      # when svelte-check ships TS 7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Workflow actions are pinned to commit SHAs (with the tag in a comment);
  # Dependabot proposes the bumps so the pins do not silently go stale.
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by dist: its pins live in dist-workspace.toml
    # ([dist.github-action-commits]); bump them there and run `dist generate`.
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
