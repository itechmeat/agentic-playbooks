name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request makes the older run worthless, so it is
# cancelled. A run on main is never cancelled: it is the one that saves the
# cargo caches every pull request restores, and a cancelled save leaves the
# next pull request compiling from cold.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: the jobs check out, build and test, and write nothing
# back to the repository.
permissions:
  contents: read

# The Linux gate is three jobs on three runners instead of one job doing
# everything in a row: the web checks, the static Rust checks (fmt, clippy,
# cargo deny) and the test suite share nothing but the checkout, and clippy
# and the tests do not even share compiled artifacts (clippy builds check
# metadata, the tests build full debug code). Measured on the single job,
# web checks, cargo deny and clippy added 1.5 to 3 minutes to the test run
# they now run beside. `build-and-test` stays as one job of that name over
# the three, because the main branch ruleset requires that check.
jobs:
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Web type check
        working-directory: web
        run: bun run check

      - name: Web unit tests
        working-directory: web
        run: bun run test

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Must precede every cargo step: apb-server embeds web/dist through
      # rust-embed, and web/dist is not checked in.
      - name: Build web (embedded by apb-server via rust-embed)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, so the toolchain comes from this input, not the ref.
          toolchain: stable
          components: clippy, rustfmt

      # Only main saves: a pull request restores main's cache and its own
      # save (10 to 30 seconds per job) would only be read by later pushes to
      # the same pull request.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo deny (licenses, advisories, bans)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  test-linux:
    runs-on: ubuntu-26.04
    # There was no ceiling here, so the default 360 applied: a test that hung
    # burned half an hour before a human cancelled the job, and would have
    # burned six. It is the outer backstop only - a stuck TEST is caught far
    # earlier, and by name, by nextest's per-test terminate-after (see
    # .config/nextest.toml). Reaching this ceiling means something outside the
    # tests wedged.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Must precede every cargo step: apb-server embeds web/dist through
      # rust-embed, and web/dist is not checked in.
      - name: Build web (embedded by apb-server via rust-embed)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, so the toolchain comes from this input, not the ref.
          toolchain: stable

      # The shared key lets the release test gate (test-gate.yml), which runs
      # the same tests on the same OS, restore what main saved here.
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Prebuilt binary, so this costs seconds and leaves the cargo cache
      # above untouched (nothing is compiled into target/).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest

      # Replaces `cargo test --workspace`. Coverage is identical: --workspace
      # is the same selection, and nextest skips #[ignore]d tests by default
      # exactly as cargo test does. What changes is that each test runs in its
      # own process, which is what makes the per-test timeout in
      # .config/nextest.toml enforceable - a hang becomes a named failing test
      # instead of a dead job. The ci profile also sets the worker count.
      - name: Test
        run: cargo nextest run --profile ci --workspace

      # nextest does not run doctests; `cargo test --workspace` did. Kept so
      # the switch loses no coverage.
      - name: Doctests
        run: cargo test --workspace --doc

  # One stable check name over the three Linux jobs: the main branch ruleset
  # requires `build-and-test`, the name the single job used to have. It runs
  # even when a job it needs failed (`!cancelled()`), so a failure is reported
  # here as a failure rather than as a skipped required check.
  build-and-test:
    needs: [web, lint, test-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Every Linux job passed
        env:
          WEB: ${{ needs.web.result }}
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test-linux.result }}
        run: |
          echo "web=$WEB lint=$LINT test-linux=$TEST"
          [ "$WEB" = "success" ] && [ "$LINT" = "success" ] && [ "$TEST" = "success" ]

  # The release gate (test-gate.yml) runs the suite on macOS arm and Intel,
  # so a Linux-only assumption in a test (a GNU tool, /proc, the util-linux
  # `setsid` binary) used to surface first on the release tag. This leg runs
  # the same tests on macOS for every PR. Web checks, cargo deny, fmt and
  # clippy stay on the Linux jobs above; clippy on macOS still runs in the
  # release gate.
  test-macos:
    runs-on: macos-latest
    # A cold macOS build plus the suite takes roughly 10 to 15 minutes; the
    # ceiling is headroom, the per-test terminate-after in .config/nextest.toml
    # catches a stuck test by name.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Must precede every cargo step: apb-server embeds web/dist through
      # rust-embed, and web/dist is not checked in.
      - name: Build web (embedded by apb-server via rust-embed)
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned by SHA, so the toolchain comes from this input, not the ref.
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@45fceba0fc176f41d2aee1ca9d6598ba628eea62 # nextest

      # The same test command as the release gate (test-gate.yml).
      - name: Test
        run: cargo nextest run --profile ci --workspace

      - name: Doctests
        run: cargo test --workspace --doc
