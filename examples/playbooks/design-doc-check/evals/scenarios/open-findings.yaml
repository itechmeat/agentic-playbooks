schema: 1
id: open-findings
title: Items stay without a verdict, the bounded re-check runs out, the person accepts them as open findings
params: { document: docs/design/cache.md }
answers:
  check:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { must_failed: 0, should_failed: 1, unchecked: 1, coverage: "CHECKLIST: 5/6" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { must_failed: 0, should_failed: 1, unchecked: 1, coverage: "CHECKLIST: 5/6" }
  decide:
    - { visit: 1, review: { decision: accept_open, note: "The one open item is a should." } }
expect:
  run: { outcome: [succeeded] }
  finish: accepted_with_open_findings
  visits: { check: 2 }
  route: { not_visits: [verdict, revise, recheck, recheck_verdict, rejected] }
