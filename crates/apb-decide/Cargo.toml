[package]
name = "agentic-playbooks-decide"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Internal crate of the apb command (crate agentic-playbooks): the decision model client. Not a public API; it changes in any release."
include = ["src/**", "LICENSE"]

[lib]
name = "apb_decide"

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true
# Blocking HTTP client for the `systemone` adapter; the engine's drive loop is
# synchronous, so no async runtime is involved.
ureq.workspace = true

[features]
# `apb_decide::testing`: a multi-response HTTP stub server for the tests of
# this crate and of the engine. Never enabled in a release build.
testing = []

[dev-dependencies]
apb-decide = { package = "agentic-playbooks-decide", path = ".", features = ["testing"] }
