[package]
name = "apb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
percent-encoding.workspace = true
jsonschema.workspace = true
shell-words.workspace = true
rust-embed = "8.12"
globset.workspace = true
# Inbound webhook signature verification (spec 2026-08-16-webhook-ingest):
# HMAC-SHA256 over the raw request body. sha2 is already a dependency above;
# the constant-time comparison comes from server_auth, which owns `subtle`
# for the whole crate.
hmac.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true
# `apb doctor`'s decision-provider probe (`decision_probe`): one free GET per
# provider, the same blocking client the decision adapters use.
ureq.workspace = true
# zcode: evaluates ZCode's built-in `modelMatch` rules (JS-compatible subset)
# to find a model's reasoning levels (a selection without one is rejected by
# ZCode and silently replaced by a different model).
regex.workspace = true
# zcode `ui_sync` (see `zcode_tasks_index`).
rusqlite.workspace = true

# Group termination of the agent-detection probe tree (Unix): kill(-pgid,
# SIGKILL) as a syscall rather than a `kill -KILL -<pgid>` subprocess, whose
# argument parsing differs between BSD kill (macOS) and procps-ng kill (Linux).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# TypeScript declarations for the core types the dashboard consumes (the
# trash listing), derived only under the `ts` feature: apb-server's contract
# test turns it on to render `web/src/lib/api.gen.ts`.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]
# `apb_core::process_mode::testing`: runs a test body in a read-only child
# process. Enabled by the dev-dependencies of the crates whose tests use it.
# Refused at compile time in a build without debug assertions (`lib.rs`).
testing = []

[dev-dependencies]
# The crate's own `testing` seams for its integration tests (the
# `isolate_test_config!` its test binary expands), so `cargo test -p
# apb-core` builds without another crate turning the feature on.
apb-core = { path = ".", features = ["testing"] }
tempfile = "3.27.0"
