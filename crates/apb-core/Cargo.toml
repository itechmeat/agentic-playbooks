[package]
name = "apb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
sha2.workspace = true
uuid.workspace = true
percent-encoding.workspace = true
jsonschema.workspace = true
shell-words.workspace = true
rust-embed = "8.12"
globset.workspace = true
# Inbound webhook signature verification (spec 2026-08-16-webhook-ingest):
# HMAC-SHA256 over the raw request body. sha2 is already a dependency above;
# the constant-time comparison comes from server_auth, which owns `subtle`
# for the whole crate.
hmac.workspace = true
base64.workspace = true
getrandom.workspace = true
subtle.workspace = true

# Group termination of the agent-detection probe tree (Unix): kill(-pgid,
# SIGKILL) as a syscall rather than a `kill -KILL -<pgid>` subprocess, whose
# argument parsing differs between BSD kill (macOS) and procps-ng kill (Linux).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
