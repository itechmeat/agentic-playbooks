# apb-freeze-document: node-common/agent_task
schema: 2
id: nc-agent
name: Node common agent
version: 1.0.0
nodes:
  - { id: start, type: start }
  - id: mid
    type: agent_task
    prompt: p
    title: The act
    effects: [fs_write]
    expected_duration: 90
    inputs:
      files: ["src/**"]
      extract: "reports/*.json"
      fields: [head, { name: result, type: string, values: [ok], required: true }]
    outputs:
      files: ["out/*.txt"]
      fields: [result]
    cache: { mode: auto, ttl: 30m, key: "{{nodes.probe.output.head}}" }
    success_check:
      script: "scripts/check.sh"
      scope: ["out/**"]
      prove_fails_first: true
      on_green_before: skip
    context:
      max_bytes: 5000
    completion_check: enforce
    route: auto
    auto_decide_ok: true
    stall_after: 5
    writes: ["out/**"]
    max_changed_files: 10
    untrusted: true
    accept_untrusted: true
    fork:
      on_branch_failure: wait
      on_failure: done
    list:
      items:
        inline: [a, b]
      batch:
        parallel: 2
        size: 5
    results:
      - { path: "out/report.md", scope: run, format: records }
    evidence:
      from: [mid]
      kinds: [records]
      claims: required
      on_invalid: fail
      budget_chars: 4000
    unattended:
      decide: approve
      note: safe
  - { id: done, type: finish, outcome: success }
edges:
  - { from: start, to: mid }
  - { from: mid, to: done }
