# apb-freeze-document: node/judge
schema: 2
id: n-judge
name: Node judge
version: 1.0.0
nodes:
  - { id: start, type: start }
  - id: mid
    type: judge
    state:
      summary: "{{nodes.act.output}}"
    questions:
      correct:
        type: choice
        instructions: "Was the answer correct?"
        criteria: { yes: "it was", no: "it was not" }
      score:
        type: score
        instructions: "Rate 0 to 1."
        levels: [high, partial]
      flag:
        type: noul
        instructions: "Flag it?"
        criteria: { done: "the text says so" }
    thresholds:
      correct: { min_confidence: 0.7, below: as_below }
      score: { min_confidence: 0.5, yes_at: 0.8, bands: { high: [0.75, 1.0] } }
    on_unavailable: emulate
    profile: apb-main
  - { id: done, type: finish, outcome: success }
