# Contract fixture for the claude agent, read by `suite/agent_contract`.
# The machine-output scenarios replay the recorded `-p --output-format json`
# result in apb-core's `agent_output` fixtures (ids replaced by placeholders);
# the rest are synthetic and say so.
agent: claude
provenance: captured
checked_against: 2.1.283
scenarios:
  success:
    stdout_file: ../../../../apb-core/tests/fixtures/agent_output/claude_result.json
    expect:
      output: hello
      final_record: true
  error:
    provenance: synthetic
    stdout: '{"type":"result","subtype":"error_during_execution","is_error":true,"result":"API Error: 500 internal server error","session_id":"0f5b6a52-4f7e-4a8e-9c1d-2b3c4d5e6f70","usage":{"input_tokens":12,"output_tokens":3}}'
    exit: 1
    expect:
      message: "API Error: 500"
      model_turn: true
  quota:
    provenance: synthetic
    stdout: '{"type":"result","subtype":"success","is_error":true,"result":"API Error: 429 rate_limit_error, retry-after: 30","session_id":"0f5b6a52-4f7e-4a8e-9c1d-2b3c4d5e6f70"}'
    exit: 1
    expect:
      kind: quota
      retry_after_secs: 30
  session:
    stdout_file: ../../../../apb-core/tests/fixtures/agent_output/claude_result.json
    expect:
      session: 0f5b6a52-4f7e-4a8e-9c1d-2b3c4d5e6f70
      fresh: assigned
      continues: true
      missing: "No conversation found with session ID: 0f5b6a52-4f7e-4a8e-9c1d-2b3c4d5e6f70"
  usage:
    stdout_file: ../../../../apb-core/tests/fixtures/agent_output/claude_result.json
    expect:
      usage:
        input_tokens: 18
        output_tokens: 443
        cache_read_tokens: 52079
        cache_write_tokens: 14967
        cost_usd: 0.0373749
        source: reported
  verdict:
    provenance: synthetic
    stdout: '{"type":"result","subtype":"success","is_error":true,"result":"I could not finish the task.","session_id":"0f5b6a52-4f7e-4a8e-9c1d-2b3c4d5e6f70"}'
    expect:
      status: failed
