[package]
name = "agentic-playbooks-mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Internal crate of the apb command (crate agentic-playbooks): the MCP client of connector calls. Not a public API; it changes in any release."
include = ["src/**", "LICENSE"]

[lib]
name = "apb_mcp_client"

[dependencies]
# `apb_core::secret::Secret` and the program-start guard.
apb-core.workspace = true
# The version `apb-mcp` pins. No `transport-child-process`: apb spawns the
# server itself and hands rmcp the two pipes. The Streamable HTTP worker
# without reqwest and without `auth`: apb's own client (`src/http.rs`)
# sends every request over ureq.
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-async-rw", "transport-streamable-http-client"] }
# The HTTP requests of an http MCP server.
ureq.workspace = true
# The stream types rmcp's `StreamableHttpClient` trait names (both already
# in the tree through rmcp).
futures = "0.3"
sse-stream = "0.2.4"
tokio.workspace = true
serde_json.workspace = true
# The frame reader that refuses a member named twice.
serde.workspace = true
thiserror.workspace = true
# The digest of a program file, read from the descriptor that starts it.
sha2.workspace = true
# Unix only, like every target apb ships: the descriptor a program starts
# from, its process group (`killpg`) and the unreaped exit check (`waitid`).
libc = "0.2"

[features]
# The scripted stdio server (`testing::StubServer`) the client, engine and
# CLI tests start.
testing = []

[dev-dependencies]
apb-mcp-client = { package = "agentic-playbooks-mcp-client", path = ".", features = ["testing"] }
# `apb_core::process_mode::testing`: guard tests in a read-only child process.
apb-core = { package = "agentic-playbooks-core", path = "../apb-core", features = ["testing"] }
tempfile = "3.27.0"
# A paused clock for the close's drain tests, so its own bound never cuts
# them short on a loaded machine. Test builds only.
tokio = { workspace = true, features = ["test-util"] }
