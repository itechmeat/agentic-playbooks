# Journal corpus writer with an executor chain (journal_corpus_test.rs,
# rows X1 and X2). `work` is an agent node whose primary reply the
# `success_check` rejects, so the chain enters its fallback; `ok` composes
# its closing answer with the same profile. The case's stub agent passes
# only on the fallback model and can hold the composer. No script.
schema: 2
id: corpus-exec
name: Journal corpus executor chain
version: 1.0.0
defaults:
  profile: corpus-exec
nodes:
  - { id: start, type: start }
  - { id: work, type: agent_task, prompt: "WORK", max_retries: 0, success_check: { marker: "PASSES" } }
  - { id: gate, type: human_review, options: [approved, rejected] }
  - { id: ok, type: finish, outcome: success, prompt: "COMPOSE" }
  - { id: no, type: finish, outcome: failure }
edges:
  - { from: start, to: work }
  - { from: work, to: gate }
  - { from: gate, to: ok, condition: { type: review_status, equals: approved } }
  - { from: gate, to: no, condition: { type: review_status, equals: rejected } }
