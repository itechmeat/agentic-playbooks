# Journal corpus writer with a bounded duplicate pair (journal_corpus_test.rs,
# row 10): two identical bounded edges `work -> dup`, so the new writer
# journals one decision record naming both addresses and one counted record,
# and the run waits at a human_review gate for an older binary to resume.
schema: 2
id: corpus-routes
name: Journal corpus routes
version: 1.0.0
nodes:
  - { id: start, type: start }
  - { id: work, type: script, script: "scripts/work.sh", runner: sh }
  - { id: dup, type: script, script: "scripts/dup.sh", runner: sh }
  - { id: gate, type: human_review, options: [approved, rejected] }
  - { id: ok, type: finish, outcome: success }
  - { id: no, type: finish, outcome: failure }
edges:
  - { from: start, to: work }
  - { from: work, to: dup, max_traversals: 1 }
  - { from: work, to: dup, max_traversals: 1 }
  - { from: dup, to: gate }
  - { from: gate, to: ok, condition: { type: review_status, equals: approved } }
  - { from: gate, to: no, condition: { type: review_status, equals: rejected } }
