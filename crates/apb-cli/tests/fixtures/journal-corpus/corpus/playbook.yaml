# Writer playbook of the journal corpus (journal_corpus_test.rs). Script
# only, so no agent is needed, and limited to what apb 0.25.0 already
# understands: a script, a sub-playbook node and a human_review gate that
# leaves the run waiting.
schema: 2
id: corpus
name: Journal corpus writer
version: 1.0.0
nodes:
  - { id: start, type: start }
  - { id: work, type: script, script: "scripts/work.sh", runner: sh, expected_duration: 10s }
  - { id: sub, type: playbook, playbook: corpus-child, expected_duration: 10s }
  - { id: gate, type: human_review, options: [approved, rejected] }
  - { id: ok, type: finish, outcome: success }
  - { id: no, type: finish, outcome: failure }
edges:
  - { from: start, to: work }
  - { from: work, to: sub }
  - { from: sub, to: gate }
  - { from: gate, to: ok, condition: { type: review_status, equals: approved } }
  - { from: gate, to: no, condition: { type: review_status, equals: rejected } }
