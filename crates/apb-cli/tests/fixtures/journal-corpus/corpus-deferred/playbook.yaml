# Journal corpus writer with a deferred retry (journal_corpus_test.rs, rows
# D1 to D8). `flaky` is an agent node the case's stub agent fails once, so
# its one retry waits `retry_delay`; `work` is a sibling script that runs
# meanwhile (held by the `hold` file), and the gate joins both. The case
# replaces the delay per row. An older apb drops `retry_delay`.
schema: 2
id: corpus-deferred
name: Journal corpus deferred retry
version: 1.0.0
nodes:
  - { id: start, type: start }
  - { id: flaky, type: agent_task, prompt: "FLAKY", profile: corpus, max_retries: 1, retry_delay: { initial: 10m } }
  - { id: work, type: script, script: "scripts/work.sh", runner: sh }
  - { id: gate, type: human_review, options: [approved, rejected] }
  - { id: ok, type: finish, outcome: success }
  - { id: no, type: finish, outcome: failure }
edges:
  - { from: start, to: flaky }
  - { from: start, to: work }
  - { from: flaky, to: gate }
  - { from: work, to: gate }
  - { from: gate, to: ok, condition: { type: review_status, equals: approved } }
  - { from: gate, to: no, condition: { type: review_status, equals: rejected } }
