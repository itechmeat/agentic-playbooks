[package]
name = "apb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local runner for agentic playbooks: the apb command, with a web dashboard and an MCP server for coding agents"
homepage.workspace = true
rust-version.workspace = true
keywords = ["agents", "playbooks", "mcp", "automation", "workflow"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"
include = ["src/**", "assets/**", "README.md", "LICENSE"]

[[bin]]
name = "apb"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
# The one-time code typed back to remove the last passkey.
getrandom.workspace = true
apb-core.workspace = true
apb-server.workspace = true
tokio.workspace = true
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
open = "5.3.6"
serde_json.workspace = true
apb-engine.workspace = true
apb-mcp.workspace = true
cliclack = "0.5.5"
axoupdater = { version = "0.10.0", default-features = false, features = ["github_releases", "blocking"] }
yaml_serde.workspace = true

# `apb eval`: the SIGINT/SIGTERM handler and the process-group cleanup.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `APB_TEST_BILLING_DEFAULT` in the `apb` the suites spawn.
apb-core = { package = "agentic-playbooks-core", path = "../apb-core", features = ["testing"] }
# The start key's lookup barrier (`start_key::testing`) in the `apb` the
# suites spawn.
apb-engine = { package = "agentic-playbooks-engine", path = "../apb-engine", features = ["testing"] }
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
jsonschema.workspace = true
# The scripted stdio MCP server the connector tests start.
apb-mcp-client = { package = "agentic-playbooks-mcp-client", path = "../apb-mcp-client", features = ["testing"] }
# Process-group signalling and liveness checks in the detached-driver suite,
# as syscalls rather than `kill` subprocesses: `kill -9 -<pgid>` is accepted by
# BSD kill (macOS) and rejected by procps-ng kill (Linux), which silently
# turned the group kill into a no-op and hung the suite on CI.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
