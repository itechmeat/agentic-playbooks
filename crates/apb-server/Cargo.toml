[package]
name = "apb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apb-core = { path = "../apb-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.7", features = ["cors"] }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
notify = "8.2"
uuid = { version = "1.23.4", features = ["v4"] }
rust-embed = "8.12"
mime_guess = "2.0.5"
apb-engine = { version = "1.0.0-beta.4", path = "../apb-engine" }
apb-mcp = { version = "1.0.0-beta.4", path = "../apb-mcp" }
# Self-contained WebAuthn passkey verification (module `webauthn`): ES256 and
# EdDSA public-key verification over COSE keys, CBOR parsing for the
# attestation object, and SHA-256 for the authenticator data hash. No
# webauthn-rs: the dashboard verifies passkey assertions directly with these
# primitives.
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["der", "std"] }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1", "std"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# The machine name in the passkey enrollment and removal notices.
hostname = "0.4"
ciborium = "0.2"
sha2.workspace = true
base64.workspace = true

[dev-dependencies]
# The generated-TypeScript contract test (`src/ts_contract.rs`) needs the run
# types' and the trash types' TS derives.
apb-engine = { version = "1.0.0-beta.4", path = "../apb-engine", features = ["ts"] }
apb-core = { path = "../apb-core", features = ["ts", "testing"] }
apb-mcp = { version = "1.0.0-beta.4", path = "../apb-mcp", features = ["ts"] }
ts-rs = "12"
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"
