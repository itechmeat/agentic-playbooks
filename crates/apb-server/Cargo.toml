[package]
name = "apb-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apb-core = { path = "../apb-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
thiserror.workspace = true
axum = { version = "0.8", features = ["ws"] }
tower = "0.5.3"
tower-http = { version = "0.7", features = ["cors"] }
hyper-util = { version = "0.1.20", features = [
    "server-auto",
    "server-graceful",
    "service",
    "tokio",
] }
notify = "8.2"
uuid = { version = "1.23.4", features = ["v4"] }
rust-embed = "8.12"
mime_guess = "2.0.5"
apb-engine = { version = "0.24.0", path = "../apb-engine" }
apb-mcp = { version = "0.24.0", path = "../apb-mcp" }

[dev-dependencies]
# The generated-TypeScript contract test (`src/ts_contract.rs`) needs the run
# types' and the trash types' TS derives.
apb-engine = { version = "0.24.0", path = "../apb-engine", features = ["ts"] }
apb-core = { path = "../apb-core", features = ["ts"] }
ts-rs = "12"
http-body-util = "0.1.3"
tempfile = "3.27.0"
tower = "0.5.3"
