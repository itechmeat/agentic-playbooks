[package]
name = "agentic-playbooks-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
description = "Internal crate of the apb command (crate agentic-playbooks): the MCP server and its tools. Not a public API; it changes in any release."
include = ["src/**", "embedded/**", "LICENSE"]

[lib]
name = "apb_mcp"

[dependencies]
apb-core.workspace = true
apb-engine.workspace = true
apb-decide.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml_serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
anyhow = "1.0"
rmcp = { version = "=3.11.0", features = ["transport-io"] }
schemars = "1.2.1"
hmac.workspace = true
sha2.workspace = true
uuid.workspace = true
# The TypeScript derives of the shapes the HTTP API returns as they are
# (grades, the candidate decision after a grade); only under the `ts`
# feature, which apb-server's contract test turns on.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs", "apb-engine/ts", "apb-core/ts"]
# Test-only seams for the integration tests (`tools::install_faults`,
# `tools::trigger::test_hooks`). Refused at compile time in a build without
# debug assertions (`lib.rs`).
testing = []

[dev-dependencies]
# The crate's own `testing` seams for its integration tests.
apb-mcp = { package = "agentic-playbooks-mcp", path = ".", features = ["testing"] }
# `apb_core::process_mode::testing`: guard tests in a read-only child process.
# `apb_engine::deadline_hooks`: a test holds the fire at the key's admission.
apb-core = { package = "agentic-playbooks-core", path = "../apb-core", features = ["testing"] }
apb-decide = { package = "agentic-playbooks-decide", path = "../apb-decide", features = ["testing"] }
apb-engine = { package = "agentic-playbooks-engine", path = "../apb-engine", features = ["testing"] }
tempfile = "3.27.0"
