schema: 1
id: judge-rejects-every-message
title: The judge rejects every classification, each message is classified again once, then needs a look, and the enforced goal fails the run
instruction: "What needs me this week."
params: { mail_folder: INBOX, since_days: 7 }
answers:
  search:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { messages: '[{"uid": 101, "date": "2026-11-02", "from": "sender@example.com", "subject": "message 101", "snippet": "text"}, {"uid": 102, "date": "2026-11-02", "from": "sender@example.com", "subject": "message 102", "snippet": "text"}, {"uid": 103, "date": "2026-11-02", "from": "sender@example.com", "subject": "message 103", "snippet": "text"}]', total: "3", truncated: "false" }
  classify:
    - visit: 1
      items:
        "101":
          - { status: succeeded, outputs: { category: action_needed, summary: "The landlord asks for the meter reading by Friday." } }
          - { status: succeeded, outputs: { category: action_needed, summary: "The landlord asks for the meter reading by Friday." } }
        "102":
          - { status: succeeded, outputs: { category: reply_needed, summary: "A colleague asks whether Tuesday works for the review." } }
          - { status: succeeded, outputs: { category: reply_needed, summary: "A colleague asks whether Tuesday works for the review." } }
        "103":
          - { status: succeeded, outputs: { category: newsletter, summary: "The weekly digest of a mailing list." } }
          - { status: succeeded, outputs: { category: newsletter, summary: "The weekly digest of a mailing list." } }
      judge: { verdict: { value: reject, p: 0.9, confidence: 0.9 } }
  digest:
    - visit: 1
      attempts:
        - { status: succeeded, outputs: { digest: "INBOX DIGEST: INBOX, the last 7 days" } }
expect:
  run: { outcome: [failed] }
  finish: done
  visits: { classify: 1, digest: 1 }
