schema: 1
id: reviewer-dirty-fails-at-once
title: A security reviewer that changes a tracked file fails at once and the report still names the gap
instruction: "Review the export change."
params: { target: "HEAD", base: "main" }
answers:
  scope:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { candidate: "abc123..def456", files: "[\"src/export.rs\"]", summary: "streams the export", intent: "stream the export", checks: "cargo test" }
  review_correctness:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { role: correctness, coverage: "the whole diff", findings: "[]" }
  review_security:
    - visit: 1
      attempts:
        - { status: succeeded, output: "the security review notes", read_only: { dirty: ["src/export.rs"] } }
  review_tests:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { role: tests, coverage: "the whole diff", findings: "[]" }
  native_checks:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { results: "[{\"command\": \"cargo test\", \"result\": \"passed\"}]", fresh: "true" }
  report:
    - visit: 1
      attempts:
        - { status: succeeded, output: "REVIEW REPORT: partial coverage, the security reviewer failed and its review is missing." }
expect:
  # The scripted dirty paths fail the reviewer at once: read_only_violated,
  # one attempt, no retry. The failed reviewer is delivered into the join
  # of the report, so the report runs and the run succeeds; the report is
  # what must say the coverage is partial.
  run: { outcome: [succeeded] }
  finish: report
  visits: { scope: 1, review_correctness: 1, review_security: 1, review_tests: 1, native_checks: 1, report: 1 }
  status: { review_security: failed, report: succeeded }
  edges:
    taken: { "e:review_correctness>report#1": 1, "e:review_security>report#1": 1, "e:review_tests>report#1": 1, "e:native_checks>report#1": 1 }
  outputs:
    - { node: review_security, matches: "^read_only_dirty:" }
