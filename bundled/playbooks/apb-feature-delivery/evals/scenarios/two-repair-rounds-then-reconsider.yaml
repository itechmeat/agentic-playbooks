schema: 1
id: two-repair-rounds-then-reconsider
title: Two repair rounds leave the defect open and the third round goes to reconsider, never to another fix
instruction: "Keep the change small."
params: { change_kind: feature, task: "Add a --json flag to the export command" }
baseline: skip
answers:
  intake:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { original_request: "Add a --json flag to the export command", expected: "[\"the export prints JSON with --json\"]", exclusions: "none", must_preserve: "the text output", assumptions: "[]", issuer: "the person at the terminal", risk_triggers: "public CLI contract", checks: "cargo test" }
  design:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { ready: "true", design: "add the flag and a JSON writer", advisor: "a fresh subagent", assumptions: "[]", question: "" }
  decompose:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { triggers: "none", decomposed: "false", subtasks: '[]' }
  implement:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { changed_paths: "[\"src/export.rs\"]", evidence: "cargo test passed", gaps: "" }
  review_correctness:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { role: correctness, blocking: "1", findings: "[{\"id\": \"c1\", \"class\": \"defect\", \"disposition\": \"open\"}]" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { role: correctness, blocking: "1", findings: "[{\"id\": \"c1\", \"class\": \"defect\", \"disposition\": \"open\"}]" }
    - visit: 3
      attempts:
        - status: succeeded
          outputs: { role: correctness, blocking: "1", findings: "[{\"id\": \"c1\", \"class\": \"defect\", \"disposition\": \"open\"}]" }
  review_security:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { role: security, blocking: "0", findings: "[]" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { role: security, blocking: "0", findings: "[]" }
    - visit: 3
      attempts:
        - status: succeeded
          outputs: { role: security, blocking: "0", findings: "[]" }
  review_tests:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { role: tests, blocking: "0", findings: "[]" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { role: tests, blocking: "0", findings: "[]" }
    - visit: 3
      attempts:
        - status: succeeded
          outputs: { role: tests, blocking: "0", findings: "[]" }
  collect:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { open_count: "1", findings: '[{"id": "c1", "disposition": "open"}]', roles: "correctness, security, tests" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { open_count: "1", findings: '[{"id": "c1", "disposition": "open"}]', roles: "correctness, security, tests" }
    - visit: 3
      attempts:
        - status: succeeded
          outputs: { open_count: "1", findings: '[{"id": "c1", "disposition": "open"}]', roles: "correctness, security, tests" }
  fix:
    - visit: 1
      attempts:
        - status: succeeded
          outputs: { dispositions: "[c1 fixed]", changed_paths: "[\"src/export.rs\"]", evidence: "cargo test passed" }
    - visit: 2
      attempts:
        - status: succeeded
          outputs: { dispositions: "[c1 fixed]", changed_paths: "[\"src/export.rs\"]", evidence: "cargo test passed" }
  reconsider:
    - visit: 1
      attempts:
        - { status: succeeded, output: "The run stopped before a converged review." }
expect:
  run: { outcome: [failed] }
  finish: reconsider
  visits: { review_correctness: 3, collect: 3, repair_round: 3, fix: 2 }
  # `max_traversals: 2` on the edge into fix: the third round falls back.
  edges:
    taken: { "e:repair_round>fix#1": 2, "e:repair_round>reconsider#1": 1 }
  route: { not_visits: [report, assessed] }
  # The prompts name both implementation paths, every repair round and
  # the panel's earlier state; the ones this route never runs render empty.
  templates_empty: report
