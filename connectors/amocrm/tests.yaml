      method: GET
      url: "https://example.amocrm.ru/api/v4/customers/11"

  - function: create_customers
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { records: [{ name: "apb-test-customer", next_date: 1700000000 }] }
    expect:
      method: POST
      url: "https://example.amocrm.ru/api/v4/customers"

  - function: update_customer
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { id: 11, record: { next_price: 500 } }
    expect:
      method: PATCH
      url: "https://example.amocrm.ru/api/v4/customers/11"
