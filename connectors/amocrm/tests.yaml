      method: GET
      url: "https://example.amocrm.ru/api/v4/companies?filter%5Bname%5D=Acme"

  - function: get_company
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { id: 3 }
    expect:
      method: GET
      url: "https://example.amocrm.ru/api/v4/companies/3"

  - function: create_companies
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { records: [{ name: "apb-test-company" }] }
    expect:
      method: POST
      url: "https://example.amocrm.ru/api/v4/companies"

  - function: update_company
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { id: 3, record: { name: "Acme LLC" } }
    expect:
      method: PATCH
      url: "https://example.amocrm.ru/api/v4/companies/3"
      body_contains:
        name: "Acme LLC"

  # -- Batch updates ----------------------------------------------------------

  - function: update_entities
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { entity_type: "contacts", records: [{ id: 9, name: "X" }] }
    expect:
      method: PATCH
      url: "https://example.amocrm.ru/api/v4/contacts"

  - function: update_entities
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { entity_type: "companies", records: [{ id: 3, name: "Y" }] }
    expect:
      method: PATCH
      url: "https://example.amocrm.ru/api/v4/companies"

  # -- Customers --------------------------------------------------------------

  - function: list_customers
    account: { base_url: "https://example.amocrm.ru", drive_url: "https://drive-b.amocrm.ru" }
    args: { filter_status_id: 5, limit: 10 }
