name: imap
version: 0.2.0
healthcheck: verify
auth:
  kind: oauth2_refresh
  token_url: "{{account.oauth_token_url}}"
  authorize_url: "{{account.oauth_authorize_url}}"
  client_id_template: "{{account.oauth_client_id}}"
  client_secret_template: "{{secret.oauth_client_secret}}"
  refresh_token_template: "{{secret.oauth_refresh_token}}"
  granted_scopes_template: "{{account.oauth_granted_scopes}}"
  consent_scopes: "{{account.oauth_scopes}}"
  authorize_params:
    access_type: "{{account.oauth_access_type}}"
    prompt: "{{account.oauth_prompt}}"
account_fields:
  - name: host
    required: true
  - name: port
    required: true
  - name: use_tls
    required: false
  - name: auth_method
    required: true
  - name: username
    required: true
  - name: password
    required: false
    secret: true
  - name: from_email
    required: false
  - name: from_name
    required: false
  - name: oauth_token_url
    required: false
  - name: oauth_authorize_url
    required: false
  - name: oauth_client_id
    required: false
  - name: oauth_client_secret
    required: false
    secret: true
  - name: oauth_refresh_token
    required: false
    secret: true
  - name: oauth_scopes
    required: false
  - name: oauth_access_type
    required: false
  - name: oauth_prompt
    required: false
  - name: oauth_granted_scopes
    required: false
functions:
  - name: verify
    description: Probe the IMAP connection (connect, TLS, authenticate) without touching any mailbox
    read_only: true
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: verify
    args_schema: { type: object, properties: {}, required: [] }

  - name: list_folders
    description: List the mailbox folders visible to the account
    read_only: true
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: list_folders
    args_schema: { type: object, properties: {}, required: [] }

  - name: search_messages
    description: Search a folder for messages, reading it without marking anything seen
    read_only: true
    untrusted_output: true
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: search
      params:
        folder: "{{args.folder}}"
        limit: "{{args.limit}}"
        unread_only: "{{args.unread_only}}"
        from_contains: "{{args.from_contains}}"
        subject_contains: "{{args.subject_contains}}"
        since_days: "{{args.since_days}}"
    args_schema:
      type: object
      properties:
        folder: { type: string, description: "the mailbox folder to search, for example INBOX" }
        limit: { type: integer, minimum: 1, maximum: 100 }
        unread_only: { type: boolean }
        from_contains: { type: string, description: "matches messages whose From header contains this text" }
        subject_contains: { type: string, description: "matches messages whose Subject header contains this text" }
        since_days: { type: integer, minimum: 1, description: "only messages received within this many days" }
      required: [folder, limit]
    examples:
      - args: { folder: INBOX, limit: 20, unread_only: true, since_days: 7 }
        note: "from_contains and subject_contains are optional and, like unread_only and since_days, are simply left out of the call when not needed; searching never marks a message seen."

  - name: get_message
    description: Fetch one message by uid, reading it without marking it seen
    read_only: true
    untrusted_output: true
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: fetch
      params:
        folder: "{{args.folder}}"
        uid: "{{args.uid}}"
    args_schema:
      type: object
      properties:
        folder: { type: string, description: "the mailbox folder the message lives in, for example INBOX" }
        uid: { type: integer, description: "the message's IMAP uid, from a prior search_messages or list result" }
      required: [folder, uid]

  - name: mark_read
    description: Mark one or more messages as read (sets the \Seen flag)
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: set_flags
      params:
        folder: "{{args.folder}}"
        uids: "{{args.uids}}"
        seen: "true"
    args_schema:
      type: object
      properties:
        folder: { type: string, description: "the mailbox folder the messages live in, for example INBOX" }
        uids: { type: string, description: "comma-separated uid list, for example \"101,102\"" }
      required: [folder, uids]
    idempotency: { mode: none }
    examples:
      - args: { folder: INBOX, uids: "101,102" }
        note: "mark_read and mark_unread are separate functions, so a grant allowlist can permit one without the other."

  - name: mark_unread
    description: Mark one or more messages as unread (clears the \Seen flag)
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: set_flags
      params:
        folder: "{{args.folder}}"
        uids: "{{args.uids}}"
        seen: "false"
    args_schema:
      type: object
      properties:
        folder: { type: string, description: "the mailbox folder the messages live in, for example INBOX" }
        uids: { type: string, description: "comma-separated uid list, for example \"101,102\"" }
      required: [folder, uids]

  - name: append_draft
    description: Compose an email message and file it as a draft in the mailbox (the message is never sent)
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: append_draft
      message:
        from_email: "{{account.from_email}}"
        from_name: "{{account.from_name}}"
        to: "{{args.to}}"
        cc: "{{args.cc}}"
        bcc: "{{args.bcc}}"
        subject: "{{args.subject}}"
        body_text: "{{args.body_text}}"
        body_html: "{{args.body_html}}"
        in_reply_to: "{{args.in_reply_to}}"
        references: "{{args.references}}"
      params:
        folder: "{{args.folder}}"
    args_schema:
      type: object
      properties:
        to: { type: string, description: "comma-separated list of recipient addresses" }
        cc: { type: string, description: "comma-separated list, optional" }
        bcc: { type: string, description: "comma-separated list, optional" }
        subject: { type: string }
        body_text: { type: string }
        body_html: { type: string, description: "optional; combines with body_text into a multipart message when both are present" }
        in_reply_to: { type: string, description: "optional Message-ID this draft replies to, threaded by mail clients" }
        references: { type: string, description: "optional space-separated Message-IDs of the thread" }
        folder: { type: string, description: "optional drafts folder; without it the folder the server marks \\Drafts is used" }
      required: [to, subject, body_text]
    people: { subject: subject, text: body_text }
    idempotency: { mode: none }
    examples:
      - args: { to: ops@example.com, subject: "Release notes draft", body_text: "Draft of the release notes for review." }
        note: "The draft is filed with the \\Draft and \\Seen flags and never sent. Without a folder the folder the server marks \\Drafts is used; pass one to pick it."

  - name: save_attachments
    description: Save one message's attachments into this run's attachments directory, reading the mailbox without changing it
    read_only: true
    untrusted_output: true
    imap:
      connection:
        host: "{{account.host}}"
        port: "{{account.port}}"
        use_tls: "{{account.use_tls}}"
        auth_method: "{{account.auth_method}}"
        username: "{{account.username}}"
        password: "{{secret.password}}"
      op: save_attachments
      params:
        folder: "{{args.folder}}"
        uid: "{{args.uid}}"
    args_schema:
      type: object
      properties:
        folder: { type: string, description: "the mailbox folder the message lives in, for example INBOX" }
        uid: { type: integer, description: "the message's IMAP uid, from a prior search_messages or list result" }
      required: [folder, uid]
    examples:
      - args: { folder: INBOX, uid: 42 }
        note: "Files land under the run's attachments directory, at most 20 files, 10 MiB per file and 25 MiB per call; files left out are listed with a reason. Only works inside a run."
